;  AI 문제 자동 생성 설정 파일
;  이 파일을 수정하고 "python make_quiz.py"를 실행하면
;  여기 적은 대로 문제 SGF가 자동으로 만들어집니다.
;  ';'로 시작하는 줄은 설명이라 프로그램이 무시합니다.
